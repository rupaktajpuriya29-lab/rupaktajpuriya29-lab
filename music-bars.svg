<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <!-- Animated equalizer / music bars that constantly bounce -->
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="50%" stop-color="#5be08f"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- background subtle line -->
  <line x1="40" y1="90" x2="760" y2="90" stroke="#333" stroke-width="1" opacity="0.4"/>

  <!-- 28 bouncing bars -->
  <g transform="translate(40,90)">
    <!-- bar 1 -->
    <rect x="0" y="-20" width="18" height="20" rx="3" fill="url(#barGrad)">
      <animate attributeName="height" values="12;55;18;70;25;45;12" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-12;-55;-18;-70;-25;-45;-12" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 2 -->
    <rect x="26" y="-30" width="18" height="30" rx="3" fill="url(#barGrad)">
      <animate attributeName="height" values="25;65;15;50;40;75;25" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-25;-65;-15;-50;-40;-75;-25" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 3 -->
    <rect x="52" y="-45" width="18" height="45" rx="3" fill="url(#barGrad)">
      <animate attributeName="height" values="40;20;70;30;60;15;40" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-40;-20;-70;-30;-60;-15;-40" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 4 -->
    <rect x="78" y="-25" width="18" height="25" rx="3" fill="url(#barGrad)">
      <animate attributeName="height" values="18;55;35;80;22;48;18" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-18;-55;-35;-80;-22;-48;-18" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 5 -->
    <rect x="104" y="-50" width="18" height="50" rx="3" fill="url(#barGrad)">
      <animate attributeName="height" values="50;25;65;40;75;20;50" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-50;-25;-65;-40;-75;-20;-50" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <!-- bar 6 -->
    <rect x="130" y="-35" width="18" height="35" rx="3" fill="url(#barGrad)">
      <animate attributeName="height" values="30;70;20;55;45;15;30" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-30;-70;-20;-55;-45;-15;-30" dur="1.2s" repeatCount="indefinite"/>
